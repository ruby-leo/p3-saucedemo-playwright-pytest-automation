name: SauceDemo Automation Suite

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}    # allows manual runs from the Actions tab

permissions:
  contents: write   # needed to push the generated report to gh-pages

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium firefox

      - name: Run test suite
        id: run_tests
        # Non-fatal here so the pipeline still generates and publishes the
        # Allure report even when tests fail - the workflow is explicitly
        # failed at the end instead, once reporting/publishing is done.
        continue-on-error: true
        run: pytest

      - name: Set up Node.js (for Allure CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checkout previous gh-pages (for Allure history)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-tmp

      - name: Copy previous Allure history if present
        run: |
          mkdir -p allure-results
          if [ -d gh-pages-tmp/history ]; then
            cp -r gh-pages-tmp/history allure-results/history
          fi

      - name: Generate Allure report
        run: |
          npm install allure
          npx allure generate ./allure-results -o ./allure-report --clean

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report

      - name: Fail the workflow if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
