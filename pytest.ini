[pytest]
addopts = --browser chromium --browser firefox -s --screenshot=on --video=on --tracing=retain-on-failure -W ignore::DeprecationWarning -n auto --alluredir=allure-results
base_url = https://www.saucedemo.com
testpaths = tests
markers =
    smoke: fast, high-value checks worth running on every push
    regression: full functional coverage
    negative: invalid-input / negative-path scenarios
    authenticated: test should start already logged in as standard_user (via saved storage_state)
